<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifier Plan de Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">

<div class="container">
    <h2 class="mb-4">✏️ Modifier Plan de Test</h2>
    <form th:action="@{'/plan-de-test/' + ${plan.id} + '/modifier'}" method="post" class="bg-white p-4 rounded shadow-sm">

        <div class="mb-3">
            <label for="titre" class="form-label">Titre</label>
            <input type="text" id="titre" name="titre" class="form-control" th:value="${plan.titre}" required>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" name="description" class="form-control" rows="3" th:text="${plan.description}" required></textarea>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="outils" class="form-label">Outils</label>
                <input type="text" id="outils" name="outils" class="form-control" th:value="${plan.outils}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="commentaire" class="form-label">Commentaire</label>
                <input type="text" id="commentaire" name="commentaire" class="form-control" th:value="${plan.commentaire}" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Test Leaders associés</label>
            <div th:each="user : ${testLeaders}">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox"
                           th:id="'leader_' + ${user.id}"
                           th:name="selectedLeaders"
                           th:value="${user.id}"
                           th:checked="${plan.testLeads.contains(user)}">
                    <label class="form-check-label" th:for="'leader_' + ${user.id}"
                           th:text="${user.prenom + ' ' + user.nom}">Nom Prénom</label>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between">
            <a th:href="@{'/plan-de-test/' + ${plan.id}}" class="btn btn-secondary">Annuler</a>
            <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
        </div>
    </form>
</div>

</body>
</html>
