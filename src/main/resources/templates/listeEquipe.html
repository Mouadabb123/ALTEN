<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Équipes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* Sidebar Styles */
        .sidebar {
            height: 100vh;
            width: 250px;
            background-color: #212529;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            padding: 2rem 1rem;
        }

        .sidebar h4 {
            text-align: center;
            margin-bottom: 2rem;
        }

        .sidebar a {
            color: white;
            display: block;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .sidebar a:hover, .sidebar a.active {
            background-color: #343a40;
        }

        .logout-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
        }

        .content {
            margin-left: 250px;
            padding: 2rem;
        }

        /* Main Content Styles */
        .main-container {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Table Styles */
        .table th {
            white-space: nowrap;
        }

        /* Modal Styles */
        .modal-content {
            border-radius: 10px;
        }

        /* Badge Styles */
        .badge-assigned {
            background-color: #28a745;
        }

        .badge-unassigned {
            background-color: #6c757d;
        }

        /* Button Styles */
        .btn-add {
            background-color: #28a745;
            color: white;
        }

        /* Animation for table rows */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .table-row {
            animation: fadeIn 0.3s ease-in;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar d-flex flex-column">
    <h4>Chef de Projet</h4>
    <a href="/admin/dashboard" class="active">
        <i class="bi bi-speedometer2 me-2"></i>Dashboard
    </a>
    <a href="/admin/test-leads">
        <i class="bi bi-people me-2"></i>Test Leads
    </a>
    <a href="/admin/equipes">
        <i class="bi bi-diagram-3 me-2"></i>Mes Équipes
    </a>
    <div class="logout-btn">
        <a href="/logout" class="btn btn-outline-light w-100">
            <i class="bi bi-box-arrow-right"></i> Déconnexion
        </a>
    </div>
</div>

<!-- Content -->
<div class="content">
    <div class="main-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>
                <i class="bi bi-diagram-3 me-2"></i>
                Gestion des Équipes
            </h2>
            <button class="btn btn-add" data-bs-toggle="modal" data-bs-target="#addEquipeModal">
                <i class="bi bi-plus-circle me-1"></i> Ajouter Équipe
            </button>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">
                    <i class="bi bi-list-task me-2"></i>
                    Liste des Équipes
                </h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                        <tr>
                            <th>Nom</th>
                            <th>Test Lead</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="equipe : ${equipes}" class="table-row">
                            <td th:text="${equipe.nom}"></td>
                            <td>
                                    <span th:if="${equipe.testLead != null}"
                                          th:text="${equipe.testLead.prenom} + ' ' + ${equipe.testLead.nom}"
                                          class="badge badge-assigned"></span>
                                <span th:unless="${equipe.testLead != null}"
                                      class="badge badge-unassigned">Non assigné</span>
                            </td>

                            <td>
                                <button th:attr="data-id=${equipe.id}"
                                        class="btn btn-sm btn-warning me-1 edit-btn">
                                    <i class="bi bi-pencil"></i> Modifier
                                </button>
                                <button th:attr="data-id=${equipe.id}"
                                        class="btn btn-sm btn-danger delete-btn">
                                    <i class="bi bi-trash"></i> Supprimer
                                </button>
                                <a th:href="@{'/admin/equipes/' + ${equipe.id} + '/plannings'}"
                                   class="btn btn-sm btn-info ms-1">
                                    <i class="bi bi-calendar-check"></i> Plannings
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(equipes)}">
                            <td colspan="4" class="text-center text-muted">
                                Aucune équipe disponible.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Modal Ajout -->
<div class="modal fade" id="addEquipeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Nouvelle Équipe</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/admin/ajouter-equipe}" method="post">
                <input type="hidden" name="chefProjetId" th:value="${currentUser.id}">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Nom</label>
                        <input type="text" class="form-control" name="nom" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Test Lead</label>
                        <select class="form-select" name="testLeadId">
                            <option value="">-- Sélectionner --</option>
                            <option th:each="lead : ${testLeads}"
                                    th:value="${lead.id}"
                                    th:text="${lead.prenom} + ' ' + ${lead.nom}"></option>
                        </select>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal Modification -->
<div class="modal fade" id="editEquipeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Modifier Équipe</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="editForm" method="post">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Nom</label>
                        <input type="text" class="form-control" name="nom" id="editNom" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Test Lead</label>
                        <select class="form-select" name="testLeadId" id="editTestLead">
                            <option value="">-- Sélectionner --</option>
                            <option th:each="lead : ${testLeads}"
                                    th:value="${lead.id}"
                                    th:text="${lead.prenom} + ' ' + ${lead.nom}"></option>
                        </select>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal Suppression -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">Confirmation</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>Êtes-vous sûr de vouloir supprimer cette équipe?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Non</button>
                <form id="deleteForm" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-danger">Oui, supprimer</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
    $(document).ready(function () {
        // Gestion de la modification
        $('.edit-btn').click(function () {
            const equipeId = $(this).data('id');
            const row = $(this).closest('tr');

            const nom = row.find('td:eq(0)').text();

            $('#editNom').val(nom);
            $('#editForm').attr('action', '/admin/equipes/' + equipeId + '/modifier');

            // OUVRIR LA MODALE
            const editModal = new bootstrap.Modal(document.getElementById('editEquipeModal'));
            editModal.show();
        });

        // Gestion de la suppression
        $('.delete-btn').click(function () {
            const equipeId = $(this).data('id');
            $('#deleteForm').attr('action', '/admin/equipes/' + equipeId + '/delete');

            // OUVRIR LA MODALE
            const deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
            deleteModal.show();
        });
    });

</script>


</body>
</html>
