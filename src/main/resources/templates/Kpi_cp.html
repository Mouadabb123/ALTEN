<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KPI Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .sidebar {
            height: 100vh;
            width: 250px;
            background-color: #212529;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            padding: 2rem 1rem;
        }

        .sidebar h4 {
            text-align: center;
            margin-bottom: 2rem;
        }

        .sidebar a {
            color: white;
            display: block;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .sidebar a:hover, .sidebar a.active {
            background-color: #343a40;
        }

        .content {
            margin-left: 250px;
            padding: 2rem;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <h4>Admin Dashboard</h4>
    <a href="/admin/dashboard" class="btn btn-dark mb-2">
        <i class="bi bi-speedometer2 me-2"></i>Dashboard
    </a>
    <a href="/admin/test-leads" class="btn btn-dark mb-2">
        <i class="bi bi-people me-2"></i>Gestion Test Leads
    </a>
    <a href="/admin/equipes" class="btn btn-dark mb-2">
        <i class="bi bi-diagram-3 me-2"></i>Gestion Équipes
    </a>
    <a href="/admin/kpis" class="btn btn-dark mb-2 active">
        <i class="bi bi-bar-chart-line me-2"></i>KPI's
    </a>
    <a href="/logout" class="btn btn-outline-light mt-auto">
        <i class="bi bi-box-arrow-right me-2"></i>Déconnexion
    </a>
</div>

<!-- Content -->
<div class="content">
    <div class="container">
        <h2 class="mb-4 text-center">Indicateurs Clés (KPI) par Test Lead</h2>

        <div th:each="kpi : ${kpis}" class="mb-5">
            <h4 th:text="${kpi.lead}" class="text-center mb-3">Nom du Test Lead</h4>
            <div class="row">
                <div class="col-md-4">
                    <div class="card text-white bg-success mb-3">
                        <div class="card-body">
                            <h5 class="card-title">Taux d'exécution</h5>
                            <p class="card-text display-6" th:text="${kpi.executionRate + '%'}">0%</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card text-white bg-primary mb-3">
                        <div class="card-body">
                            <h5 class="card-title">Taux de réussite</h5>
                            <p class="card-text display-6" th:text="${kpi.successRate + '%'}">0%</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card text-white bg-warning mb-3">
                        <div class="card-body">
                            <h5 class="card-title">En cours</h5>
                            <p class="card-text display-6" th:text="${kpi.pendingRate + '%'}">0%</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center">
            <a href="/admin/dashboard" class="btn btn-outline-secondary">Retour au Dashboard</a>
        </div>
    </div>
</div>

</body>
</html>
