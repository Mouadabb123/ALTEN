<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détails des modifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Détails des modifications</h2>

    <div class="card mb-4">
        <div class="card-header">
            <h4 th:text="'Action: ' + ${historique.action}"></h4>
        </div>
        <div class="card-body">
            <p><strong>Date:</strong>
                <span th:text="${#temporals.format(historique.dateAction, 'dd/MM/yyyy HH:mm')}"></span></p>
            <p><strong>Utilisateur:</strong>
                <span th:text="${historique.utilisateur.prenom + ' ' + historique.utilisateur.nom}"></span></p>
            <p><strong>Détails:</strong>
                <span th:text="${historique.details}"></span></p>
        </div>
    </div>

    <div th:if="${planning != null}">
        <h3>Planning concerné</h3>
        <div class="card">
            <div class="card-body">
                <h5 th:text="${planning.tache}"></h5>
                <p th:text="${planning.commentaire}"></p>
                <p th:text="${'Du ' + #temporals.format(planning.dateDebut, 'dd/MM/yyyy') +
                            ' au ' + #temporals.format(planning.dateFin, 'dd/MM/yyyy')}"></p>
            </div>
        </div>
    </div>

    <a href="/historique" class="btn btn-secondary mt-3">Retour à l'historique</a>
</div>
</body>
</html>
