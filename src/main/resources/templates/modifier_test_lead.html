<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${testLead.id} ? 'Modifier Test Lead' : 'Nouveau Test Lead'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${testLead.id} ? 'Modifier Test Lead' : 'Nouveau Test Lead'"></h2>

    <form th:action="${testLead.id} ? @{'/test-leads/' + ${testLead.id}} : @{/test-leads}"
          method="post">
        <div class="mb-3">
            <label class="form-label">Nom</label>
            <input type="text" class="form-control" th:field="*{testLead.nom}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Prénom</label>
            <input type="text" class="form-control" th:field="*{testLead.prenom}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{testLead.email}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" class="form-control" name="password"
                   th:required="${!testLead.id}" placeholder="Laisser vide pour ne pas changer">
        </div>

        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a th:href="@{/test-leads}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
</body>
</html>
