<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Plannings de l'équipe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .sidebar {
            height: 100vh;
            width: 250px;
            background-color: #212529;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            padding: 2rem 1rem;
        }
        .content {
            margin-left: 250px;
            padding: 2rem;
        }
    </style>
</head>
<body>
<!-- Sidebar -->
<div class="sidebar">
    <h4 class="text-center mb-4">Dashboard Chef de Projet</h4>
    <div class="d-flex flex-column">
        <a href="/admin/dashboard" class="btn btn-dark mb-2">
            <i class="bi bi-speedometer2 me-2"></i>Dashboard
        </a>
        <a href="/admin/test-leads" class="btn btn-dark mb-2">
            <i class="bi bi-people me-2"></i>Gestion Test Leads
        </a>
        <a href="/admin/equipes" class="btn btn-dark mb-2">
            <i class="bi bi-diagram-3 me-2"></i>Gestion Équipes
        </a>
        <a href="/logout" class="btn btn-outline-light mt-auto">
            <i class="bi bi-box-arrow-right me-2"></i>Déconnexion
        </a>
    </div>
</div>

<!-- Content -->
<div class="content">
    <h2 class="mb-4">Plannings de test pour l'équipe: <span th:text="${equipe.nom}"></span></h2>

    <div class="card mb-4">
        <div class="card-header">
            <h5>Liste des plannings</h5>
        </div>
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Tâche</th>
                    <th>Date Début</th>
                    <th>Date Fin</th>
                    <th>Test Lead</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="planning : ${plannings}">
                    <td th:text="${planning.tache}"></td>
                    <td th:text="${planning.dateDebut}"></td>
                    <td th:text="${planning.dateFin}"></td>
                    <td>
                        <span th:each="lead : ${planning.testLeads}"
                              th:text="${lead.prenom} + ' ' + ${lead.nom}"
                              class="badge bg-primary me-1"></span>
                    </td>
                    <td>
                        <a th:href="@{'/planning-de-test/' + ${planning.id}}"
                           class="btn btn-sm btn-info">
                            <i class="bi bi-eye"></i> Détails
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
            <div th:if="${#lists.isEmpty(plannings)}" class="alert alert-info">
                Aucun planning de test disponible pour cette équipe.
            </div>
        </div>
    </div>

    <a th:href="@{'/admin/equipes'}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Retour à la liste des équipes
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
