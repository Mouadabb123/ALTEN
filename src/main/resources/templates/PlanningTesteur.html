<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mon Planning</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .sidebar {
            height: 100vh;
            width: 250px;
            background-color: #212529;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            padding: 2rem 1rem;
        }
        .content {
            margin-left: 250px;
            padding: 2rem;
        }
        .timeline {
            position: relative;
            padding-left: 50px;
        }
        .timeline-item {
            position: relative;
            margin-bottom: 30px;
        }
        .timeline-dot {
            position: absolute;
            left: -25px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #0d6efd;
        }
        .timeline-date {
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="sidebar d-flex flex-column">
    <h4>Testeur</h4>
    <a href="/testeur/dashboard">
        <i class="bi bi-speedometer2 me-2"></i>Tableau de bord
    </a>
    <a href="/testeur/planning" class="active">
        <i class="bi bi-calendar-event me-2"></i>Planning
    </a>
    <div class="logout-btn mt-auto">
        <a href="/logout" class="btn btn-outline-light w-100">
            <i class="bi bi-box-arrow-right"></i> Déconnexion
        </a>
    </div>
</div>

<div class="content">
    <div class="container">
        <h2>Mon Planning</h2>

        <div th:if="${plannings.isEmpty()}">
            <div class="alert alert-info">
                Aucun planning disponible pour le moment.
            </div>
        </div>

        <div class="timeline" th:if="${not #lists.isEmpty(plannings)}">
            <div class="timeline-item" th:each="planning : ${plannings}">
                <div class="timeline-dot"></div>
                <div class="timeline-date">
                    <span th:text="${planning.dateDebut} + ' - ' + ${planning.dateFin}"></span>
                </div>
                <div class="card">
                    <div class="card-body">
                        <h5 th:text="${planning.tache}"></h5>
                        <p th:text="${planning.commentaire}"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
