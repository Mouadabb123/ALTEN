<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* Sidebar Styles */
        .sidebar {
            height: 100vh;
            width: 250px;
            background-color: #212529;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            padding: 2rem 1rem;
        }

        .sidebar h4 {
            text-align: center;
            margin-bottom: 2rem;
        }

        .sidebar a {
            color: white;
            display: block;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .sidebar a:hover, .sidebar a.active {
            background-color: #343a40;
        }

        .logout-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
        }

        .content {
            margin-left: 250px;
            padding: 2rem;
        }

        /* Dashboard Cards */
        .stat-card {
            height: 100%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-radius: 10px;
            border: none;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .stat-card .card-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .stat-card .card-title {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .stat-card .card-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .stat-card .card-link {
            color: white;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: opacity 0.3s;
        }

        .stat-card .card-link:hover {
            opacity: 0.8;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .content {
                margin-left: 0;
                padding: 1rem;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                padding: 1rem;
            }

            .sidebar .d-flex {
                flex-direction: row !important;
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .sidebar a {
                padding: 8px 12px;
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>
<!-- Sidebar -->
<div class="sidebar">
    <h4 class="text-center mb-4">Admin Dashboard</h4>
    <div class="d-flex flex-column">
        <a href="/admin/dashboard" class="btn btn-dark mb-2 active">
            <i class="bi bi-speedometer2 me-2"></i>Dashboard
        </a>
        <a href="/admin/test-leads" class="btn btn-dark mb-2">
            <i class="bi bi-people me-2"></i>Gestion Test Leads
        </a>
        <a href="/admin/equipes" class="btn btn-dark mb-2">
            <i class="bi bi-diagram-3 me-2"></i>Gestion Équipes
        </a>
        <a href="/admin/testeurs" class="btn btn-dark mb-2">
            <i class="bi bi-bar-chart-line me-2"></i>KPI's
        </a>
        <a href="/logout" class="btn btn-outline-light mt-auto">
            <i class="bi bi-box-arrow-right me-2"></i>Déconnexion
        </a>
    </div>
</div>

<!-- Content -->
<div class="content">
    <div class="container-fluid">
        <h2 class="mb-4"><i class="bi bi-speedometer2 me-2"></i>Tableau de Bord</h2>

        <div class="row justify-content-center">
            <!-- Test Leads Card -->
            <div class="col-md-4 mb-4">
                <div class="card text-white bg-primary stat-card">
                    <div class="card-body">
                        <h5 class="card-title">
                            <i class="bi bi-people me-2"></i>Test Leads
                        </h5>
                        <p class="card-value" th:text="${testLeadsCount}">0</p>
                        <a href="/admin/test-leads" class="card-link">
                            Voir détails <i class="bi bi-arrow-right ms-2"></i>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Équipes Card -->
            <div class="col-md-4 mb-4">
                <div class="card text-white bg-success stat-card">
                    <div class="card-body">
                        <h5 class="card-title">
                            <i class="bi bi-diagram-3 me-2"></i>Équipes
                        </h5>
                        <p class="card-value" th:text="${equipesCount}">0</p>
                        <a href="/admin/equipes" class="card-link">
                            Voir détails <i class="bi bi-arrow-right ms-2"></i>
                        </a>
                    </div>
                </div>
            </div>

            <!-- KPI -->
            <div class="col-md-4 mb-4">
                <div class="card text-white bg-info stat-card">
                    <div class="card-body">
                        <h5 class="card-title">
                            <i class="bi bi-person-badge me-2"></i>KPI
                        </h5>
                        <p class="card-value" th:text="${testeursCount}">0</p>
                        <a href="/admin/testeurs" class="card-link">
                            Voir détails <i class="bi bi-arrow-right ms-2"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section récente activité (optionnelle) -->
        <div class="card mt-4">
            <div class="card-header bg-secondary text-white">
                <h5 class="mb-0">
                    <i class="bi bi-clock-history me-2"></i>Activité Récente
                </h5>
            </div>
            <div class="card-body">
                <div class="alert alert-info mb-0">
                    <i class="bi bi-info-circle me-2"></i>
                    Aucune activité récente à afficher.
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
