<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifier Test Lead</title>
    <!-- Include your CSS here -->
    <link rel="stylesheet" href="/css/main.css">
    <!-- Bootstrap if you're using it -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
</head>
<body>
<!-- Navigation bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin/dashboard">Dashboard Admin</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/admin/test-leads">Test Leads</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/equipes">Équipes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/plannings-a-valider">Plannings à valider</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header">
                    <h3>Modifier Test Lead</h3>
                </div>
                <div class="card-body">
                    <!-- Flash messages -->
                    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <!-- Form for updating Test Lead -->
                    <form th:action="@{/admin/test-leads/{id}/modifier(id=${testLead.id})}" method="post">
                        <div class="mb-3">
                            <label for="nom" class="form-label">Nom</label>
                            <input type="text" class="form-control" id="nom" name="nom"
                                   th:value="${testLead.nom}" required>
                        </div>
                        <div class="mb-3">
                            <label for="prenom" class="form-label">Prénom</label>
                            <input type="text" class="form-control" id="prenom" name="prenom"
                                   th:value="${testLead.prenom}" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email"
                                   th:value="${testLead.email}" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Mot de passe (laisser vide pour conserver)</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="Nouveau mot de passe">
                            <small class="text-muted">Laissez ce champ vide pour conserver le mot de passe actuel.</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rôle</label>
                            <input type="text" class="form-control" value="TEST_LEADER" disabled>
                            <small class="text-muted">Le rôle ne peut pas être modifié.</small>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/admin/test-leads}" class="btn btn-secondary">Annuler</a>
                            <button type="submit" class="btn btn-primary">Enregistrer</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS if needed -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
