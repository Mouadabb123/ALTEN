<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Modifier Planning</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <div class="d-flex justify-content-between align-items-center">
                <h2 class="mb-0"><i class="fas fa-calendar-edit me-2"></i>Modifier le Planning</h2>
                <a th:href="@{'/planning-de-test/liste'}" class="btn btn-light btn-sm">
                    <i class="fas fa-arrow-left me-1"></i> Retour
                </a>
            </div>
        </div>

        <div class="card-body">
            <form th:action="@{'/planning-de-test/' + ${planning.id} + '/modifier'}" th:object="${planning}" method="post">

                <!-- ✅ Hidden ID field -->
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label for="tache" class="form-label">
                        <i class="fas fa-tasks me-1 text-primary"></i> Tâche
                    </label>
                    <input type="text" class="form-control" id="tache" th:field="*{tache}" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="dateDebut" class="form-label">
                            <i class="fas fa-calendar-start me-1 text-primary"></i> Date Début
                        </label>
                        <input type="date" class="form-control" id="dateDebut" th:field="*{dateDebut}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="dateFin" class="form-label">
                            <i class="fas fa-calendar-end me-1 text-primary"></i> Date Fin
                        </label>
                        <input type="date" class="form-control" id="dateFin" th:field="*{dateFin}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="commentaire" class="form-label">
                        <i class="fas fa-comment me-1 text-primary"></i> Commentaire
                    </label>
                    <textarea class="form-control" id="commentaire" th:field="*{commentaire}" rows="3" required></textarea>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save me-1"></i> Enregistrer
                    </button>
                    <a th:href="@{'/planning-de-test/liste'}" class="btn btn-outline-secondary">
                        <i class="fas fa-times me-1"></i> Annuler
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
