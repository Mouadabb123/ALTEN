<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Testeurs</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        /* Sidebar Styles */
        .sidebar {
            height: 100vh;
            width: 250px;
            background-color: #212529;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            padding: 2rem 1rem;
        }

        .sidebar h4 {
            text-align: center;
            margin-bottom: 2rem;
        }

        .sidebar a {
            color: white;
            display: block;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .sidebar a:hover, .sidebar a.active {
            background-color: #343a40;
        }

        .logout-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
        }

        .content {
            margin-left: 250px;
            padding: 2rem;
        }

        /* Styling for the main content container */
        .main-container {
            background-color: white;
            padding: 3rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .main-container h2 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: #333;
        }

        .btn-success {
            background-color: #28a745;
            border-color: #28a745;
        }

        .btn-success:hover {
            background-color: #218838;
            border-color: #1e7e34;
        }

        .table {
            border-radius: 8px;
            overflow: hidden;
        }

        .table th, .table td {
            padding: 12px 15px;
        }

        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #f9f9f9;
        }

        .modal-content {
            border-radius: 8px;
        }

        .modal-header, .modal-footer {
            background-color: #f8f9fa;
            border-radius: 8px;
        }

        .modal-header h5 {
            color: #333;
        }

        /* Styles pour le tri et la recherche */
        .sort-icon {
            cursor: pointer;
            margin-left: 5px;
        }

        .search-container {
            margin-bottom: 20px;
            position: relative;
        }

        .search-container input {
            padding-left: 40px;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }

        .table th {
            cursor: pointer;
            white-space: nowrap;
        }

        /* Animation pour indiquer que les plans sont filtrés */
        @keyframes highlight {
            0% { background-color: #fff2cc; }
            100% { background-color: transparent; }
        }

        .highlight-row {
            animation: highlight 1.5s ease;
        }

        .availability-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .available {
            background-color: #d4edda;
            color: #155724;
        }

        .unavailable {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar d-flex flex-column">
    <h4>Test Lead</h4>
    <a href="/plan-de-test/liste">
        <i class="bi bi-list-task me-2"></i>Plan de Test
    </a>
    <a href="/planning-de-test/liste">
        <i class="bi bi-calendar-event me-2"></i>Planning de Test
    </a>


    <a href="/testeur/liste" class="active">
        <i class="bi bi-people-fill me-2"></i>Gestion des Testeurs
    </a>

    <div class="logout-btn">
        <a href="/logout" class="btn btn-outline-light w-100">
            <i class="bi bi-box-arrow-right"></i> Déconnexion
        </a>
    </div>
</div>

<!-- Content -->
<div class="content">
    <div class="main-container">
        <h2>Gestion des Testeurs</h2>

        <div th:if="${testeurs.isEmpty()}">
            <p class="text-muted">Aucun testeur disponible.</p>
        </div>

        <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#ajouterTesteurModal">
            <i class="bi bi-plus-circle"></i> Ajouter un testeur
        </button>

        <!-- Search Bar -->
        <div class="search-container">
            <i class="bi bi-search search-icon"></i>
            <input type="text" id="searchInput" class="form-control" placeholder="Rechercher un testeur...">
        </div>

        <table class="table table-striped" id="testeursTable" th:if="${not #lists.isEmpty(testeurs)}">
            <thead>
            <tr>
                <th data-sort="numeric">ID <span class="sort-icon"><i class="bi bi-arrow-down-up"></i></span></th>
                <th data-sort="string">Nom <span class="sort-icon"><i class="bi bi-arrow-down-up"></i></span></th>
                <th data-sort="string">Prénom <span class="sort-icon"><i class="bi bi-arrow-down-up"></i></span></th>
                <th data-sort="string">Email <span class="sort-icon"><i class="bi bi-arrow-down-up"></i></span></th>
                <th data-sort="string">Disponibilité <span class="sort-icon"><i class="bi bi-arrow-down-up"></i></span></th>
                <th data-sort="numeric">Expérience <span class="sort-icon"><i class="bi bi-arrow-down-up"></i></span></th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="testeur : ${testeurs}">
                <td th:text="${testeur.id}"></td>
                <td th:text="${testeur.nom}"></td>
                <td th:text="${testeur.prenom}"></td>
                <td th:text="${testeur.email}"></td>
                <td>
                    <span th:classappend="${testeur.disponibilite} ? 'availability-badge available' : 'availability-badge unavailable'"
                          th:text="${testeur.disponibilite} ? 'Disponible' : 'Indisponible'"></span>
                </td>
                <td th:text="${testeur.experience} + ' ans'"></td>
                <td>
                    <!-- Modifier Icon -->
                    <a th:href="@{'/testeur/' + ${testeur.id} + '/modifier'}" class="btn btn-sm btn-warning" title="Modifier">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <!-- Delete Icon -->
                    <a th:href="@{'/testeur/' + ${testeur.id} + '/supprimer'}" class="btn btn-sm btn-danger" title="Supprimer" onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce testeur ?');">
                        <i class="bi bi-trash"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Message quand aucun résultat de recherche -->
        <div id="noResultsMessage" class="alert alert-info mt-3 d-none">
            Aucun testeur ne correspond à votre recherche.
        </div>
    </div>

    <!-- Modal pour ajouter un testeur -->
    <div class="modal fade" id="ajouterTesteurModal" tabindex="-1" aria-labelledby="ajouterTesteurModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="ajouterTesteurModalLabel">Nouveau Testeur</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/testeur/creer}" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="nom" class="form-label">Nom</label>
                            <input type="text" class="form-control" id="nom" name="nom" required>
                        </div>

                        <div class="mb-3">
                            <label for="prenom" class="form-label">Prénom</label>
                            <input type="text" class="form-control" id="prenom" name="prenom" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Mot de passe</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>

                        <div class="mb-3">
                            <label for="disponibilite" class="form-label">Disponibilité</label>
                            <select class="form-select" id="disponibilite" name="disponibilite" required>
                                <option value="true">Disponible</option>
                                <option value="false">Indisponible</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="experience" class="form-label">Expérience (années)</label>
                            <input type="number" class="form-control" id="experience" name="experience" min="0" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script for search and sort functionality -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Référence au tableau et à l'input de recherche
        const table = document.getElementById('testeursTable');
        const searchInput = document.getElementById('searchInput');
        const noResultsMessage = document.getElementById('noResultsMessage');

        if (!table || !searchInput) return; // Protection contre les erreurs si les éléments n'existent pas

        const tbody = table.querySelector('tbody');
        const rows = Array.from(tbody.querySelectorAll('tr'));

        // Variables pour le tri
        let sortDirection = {};
        let currentSortColumn = null;

        // Fonction de recherche dynamique
        searchInput.addEventListener('input', function() {
            const searchTerm = this.value.toLowerCase().trim();
            let visibleCount = 0;

            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                const isVisible = text.includes(searchTerm);

                row.style.display = isVisible ? '' : 'none';

                if (isVisible) {
                    visibleCount++;
                    // Ajoute une animation de surbrillance pour les lignes qui correspondent
                    if (searchTerm !== '') {
                        row.classList.add('highlight-row');
                        setTimeout(() => {
                            row.classList.remove('highlight-row');
                        }, 1500);
                    }
                }
            });

            // Afficher un message si aucun résultat n'est trouvé
            if (visibleCount === 0 && rows.length > 0) {
                noResultsMessage.classList.remove('d-none');
            } else {
                noResultsMessage.classList.add('d-none');
            }
        });

        // Configuration du tri
        const headers = table.querySelectorAll('th');

        headers.forEach(header => {
            if (!header.dataset.sort) return; // Ignorer les colonnes sans attribut de tri

            const sortIcon = header.querySelector('.sort-icon');
            if (!sortIcon) return;

            // Initialiser la direction de tri pour cette colonne
            sortDirection[header.textContent.trim()] = 'none';

            header.addEventListener('click', function() {
                const columnName = this.textContent.trim();
                const sortType = this.dataset.sort;

                // Cycle de tri: none -> asc -> desc -> none
                if (sortDirection[columnName] === 'none') {
                    sortDirection[columnName] = 'asc';
                    sortIcon.innerHTML = '<i class="bi bi-arrow-up"></i>';
                } else if (sortDirection[columnName] === 'asc') {
                    sortDirection[columnName] = 'desc';
                    sortIcon.innerHTML = '<i class="bi bi-arrow-down"></i>';
                } else {
                    sortDirection[columnName] = 'none';
                    sortIcon.innerHTML = '<i class="bi bi-arrow-down-up"></i>';

                    // Réinitialiser l'ordre d'origine
                    resetTableOrder();
                    return;
                }

                // Réinitialiser les autres icônes de tri
                headers.forEach(h => {
                    if (h !== header && h.querySelector('.sort-icon')) {
                        h.querySelector('.sort-icon').innerHTML = '<i class="bi bi-arrow-down-up"></i>';
                        sortDirection[h.textContent.trim()] = 'none';
                    }
                });

                // Déterminer l'index de la colonne
                const columnIndex = Array.from(header.parentNode.children).indexOf(header);

                // Trier les lignes
                sortTable(columnIndex, sortDirection[columnName], sortType);
            });
        });

        // Fonction pour trier le tableau
        function sortTable(columnIndex, direction, sortType) {
            const sortedRows = rows.slice().sort((a, b) => {
                const aValue = a.children[columnIndex].textContent.trim();
                const bValue = b.children[columnIndex].textContent.trim();

                if (direction === 'asc') {
                    if (sortType === 'numeric') {
                        return parseFloat(aValue) - parseFloat(bValue);
                    } else {
                        return aValue.localeCompare(bValue, 'fr', { sensitivity: 'base' });
                    }
                } else {
                    if (sortType === 'numeric') {
                        return parseFloat(bValue) - parseFloat(aValue);
                    } else {
                        return bValue.localeCompare(aValue, 'fr', { sensitivity: 'base' });
                    }
                }
            });

            // Vider et remplir le tableau avec les lignes triées
            while (tbody.firstChild) {
                tbody.removeChild(tbody.firstChild);
            }

            sortedRows.forEach(row => tbody.appendChild(row));
        }

        // Fonction pour réinitialiser l'ordre du tableau
        function resetTableOrder() {
            while (tbody.firstChild) {
                tbody.removeChild(tbody.firstChild);
            }

            rows.forEach(row => tbody.appendChild(row));
        }
    });
</script>

</body>
</html>
