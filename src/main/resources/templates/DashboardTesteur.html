<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Mes Plans de Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>


        /* Sidebar Styles */
        .sidebar {
            height: 100vh;
            width: 250px;
            background-color: #212529;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            padding: 2rem 1rem;
        }

        .sidebar h4 {
            text-align: center;
            margin-bottom: 2rem;
        }

        .sidebar a {
            color: white;
            display: block;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .sidebar a:hover, .sidebar a.active {
            background-color: #343a40;
        }

        .logout-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
        }

        .content {
            margin-left: 250px;
            padding: 2rem;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: 500;
        }
        .status-NOT_STARTED {
            background-color: #6c757d;
            color: white;
        }
        .status-ONGOING {
            background-color: #ffc107;
            color: black;
        }
        .status-OK {
            background-color: #28a745;
            color: white;
        }
        .status-KO {
            background-color: #dc3545;
            color: white;
        }

    </style>
</head>
<body>

<!-- Sidebar spécifique aux testeurs -->
<div class="sidebar d-flex flex-column">
    <h4>👨‍💼 Testeur</h4>
    <a href="/testeur/plans/mes-plans" class="active">
        <i class="bi bi-list-task me-2"></i>Mes Plans de Test
    </a>

   <div class="logout-btn mt-auto">
        <a href="/logout" class="btn btn-outline-light w-100">
            <i class="bi bi-box-arrow-right"></i> Déconnexion
        </a>
    </div>
</div>

<!-- Content -->
<div class="content">
    <div class="container">
        <h2 class="mb-4"> 📋 Mes cas de Test Assignés</h2>

        <div th:if="${plans.isEmpty()}">
            <div class="alert alert-info">
                Aucun plan de test ne vous a été assigné pour le moment.
            </div>
        </div>

        <div th:unless="${plans.isEmpty()}">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Titre</th>
                    <th>Description</th>
                    <th>Outils</th>
                    <th>Statut</th>
                    <th>Dernière mise à jour</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="plan : ${plans}">
                    <td th:text="${plan.id}"></td>
                    <td th:text="${plan.titre}"></td>
                    <td th:text="${plan.description}"></td>
                    <td th:text="${plan.outils}"></td>
                    <td>
                        <span th:text="${plan.status}"
                              th:classappend="'status-badge status-' + ${plan.status}"></span>
                    </td>
                    <td>
                        <span th:if="${plan.statusUpdateDate != null}"
                              th:text="${#temporals.format(plan.statusUpdateDate, 'dd/MM/yyyy HH:mm')}"></span>
                        <span th:if="${plan.statusUpdateDate == null}">-</span>
                    </td>
                    <td>
                        <div class="dropdown">
                            <button class="btn btn-sm btn-secondary dropdown-toggle" type="button"
                                    id="dropdownMenuButton" data-bs-toggle="dropdown"
                                    aria-expanded="false">
                                Changer statut
                            </button>
                            <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                                <li>
                                    <form th:action="@{/testeur/{id}/changer-statut(id=${plan.id})}" method="post">
                                        <input type="hidden" name="nouveauStatut" value="NOT_STARTED"/>
                                        <button type="submit" class="dropdown-item">Non commencé</button>
                                    </form>
                                </li>
                                <li>
                                    <form th:action="@{/testeur/{id}/changer-statut(id=${plan.id})}" method="post">
                                        <input type="hidden" name="nouveauStatut" value="ONGOING"/>
                                        <button type="submit" class="dropdown-item">En cours</button>
                                    </form>
                                </li>
                                <li>
                                    <form th:action="@{/testeur/{id}/changer-statut(id=${plan.id})}" method="post">
                                        <input type="hidden" name="nouveauStatut" value="OK"/>
                                        <button type="submit" class="dropdown-item">OK</button>
                                    </form>
                                </li>
                                <li>
                                    <form th:action="@{/testeur/{id}/changer-statut(id=${plan.id})}" method="post">
                                        <input type="hidden" name="nouveauStatut" value="KO"/>
                                        <button type="submit" class="dropdown-item">KO</button>
                                    </form>
                                </li>
                            </ul>
                        </div>

                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
