<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des Plannings de Test</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* Sidebar Styles */
        .sidebar {
            height: 100vh;
            width: 250px;
            background-color: #212529;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            padding: 2rem 1rem;
        }

        .sidebar h4 {
            text-align: center;
            margin-bottom: 2rem;
        }

        .sidebar a {
            color: white;
            display: block;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .sidebar a:hover, .sidebar a.active {
            background-color: #343a40;
        }

        .logout-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
        }

        .content {
            margin-left: 250px;
            padding: 2rem;
        }

        /* Styling for the main content container */
        .main-container {
            background-color: white;
            padding: 3rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .main-container h2 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: #333;
        }

        .btn-success {
            background-color: #28a745;
            border-color: #28a745;
        }

        .btn-success:hover {
            background-color: #218838;
            border-color: #1e7e34;
        }

        .table {
            border-radius: 8px;
            overflow: hidden;
        }

        .table th, .table td {
            padding: 12px 15px;
        }

        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #f9f9f9;
        }

        .modal-content {
            border-radius: 8px;
        }

        .modal-header, .modal-footer {
            background-color: #f8f9fa;
            border-radius: 8px;
        }

        .modal-header h5 {
            color: #333;
        }

        /* Styles pour le tri et la recherche */
        .sort-icon {
            cursor: pointer;
            margin-left: 5px;
        }

        .search-container {
            margin-bottom: 20px;
            position: relative;
        }

        .search-container input {
            padding-left: 40px;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }

        .table th {
            cursor: pointer;
            white-space: nowrap;
        }

        /* Animation pour indiquer que les plans sont filtrés */
        @keyframes highlight {
            0% { background-color: #fff2cc; }
            100% { background-color: transparent; }
        }

        .highlight-row {
            animation: highlight 1.5s ease;
        }

        /* Styles pour la recherche par date */
        .date-search-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }

        .date-search-container .date-group {
            flex: 1;
        }

        .date-search-container button {
            align-self: flex-end;
            height: 38px;
        }

        .truncate-text {
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Style pour l'affichage du commentaire complet */
        .tooltip-inner {
            max-width: 300px;
            text-align: left;
        }
    </style>
</head>
<body>
<div class="sidebar d-flex flex-column">
    <h4>Test Lead</h4>
    <a href="/plan-de-test/liste" >
        <i class="bi bi-list-task me-2"></i>Plan de Test
    </a>
    <a href="/planning-de-test/liste" >
        <i class="bi bi-calendar-event me-2"></i>Planning de Test
    </a>
    <a href="/historique" ><i class="bi bi-clock-history me-2"></i>Historique du planning de test  </a>
    <a href="/testeur/liste" ><i class="bi bi-people me-2"></i>Gestion des testeurs  </a>

    <div class="logout-btn">
        <a href="/logout" class="btn btn-outline-light w-100">
            <i class="bi bi-box-arrow-right"></i> Déconnexion
        </a>
    </div>
</div>
<!-- Content -->
<div class="content">
    <div class="main-container">
        <h2>Mes Plannings de Test</h2>

        <div th:if="${plannings.isEmpty()}">
            <p class="text-muted">Aucun planning de test disponible.</p>
        </div>

        <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#ajouterPlanningModal">
            <i class="bi bi-plus-circle"></i> Ajouter une tache
        </button>

        <!-- Recherche textuelle -->
        <div class="search-container">
            <i class="bi bi-search search-icon"></i>
            <input type="text" id="searchInput" class="form-control" placeholder="Rechercher un planning...">
        </div>

        <!-- Recherche par date -->
        <div class="date-search-container">
            <div class="date-group">
                <label for="startDate" class="form-label">Date début</label>
                <input type="date" class="form-control" id="startDate">
            </div>
            <div class="date-group">
                <label for="endDate" class="form-label">Date fin</label>
                <input type="date" class="form-control" id="endDate">
            </div>
            <button id="filterDates" class="btn btn-primary">
                <i class="bi bi-funnel"></i> Filtrer
            </button>
            <button id="resetDates" class="btn btn-outline-secondary">
                <i class="bi bi-x-circle"></i> Réinitialiser
            </button>
        </div>

        <table class="table table-striped" id="planningsTable" th:if="${not #lists.isEmpty(plannings)}">
            <thead>
            <tr>
                <th data-sort="numeric">ID <span class="sort-icon"><i class="bi bi-arrow-down-up"></i></span></th>
                <th data-sort="string">Tâche <span class="sort-icon"><i class="bi bi-arrow-down-up"></i></span></th>
                <th data-sort="string">Date Début <span class="sort-icon"><i class="bi bi-arrow-down-up"></i></span></th>
                <th data-sort="string">Date Fin <span class="sort-icon"><i class="bi bi-arrow-down-up"></i></span></th>
                <th data-sort="string">Commentaire <span class="sort-icon"><i class="bi bi-arrow-down-up"></i></span></th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="planning : ${plannings}">
                <td th:text="${planning.id}"></td>
                <td th:text="${planning.tache}"></td>
                <td th:text="${planning.dateDebut}" class="date-value"></td>
                <td th:text="${planning.dateFin}" class="date-value"></td>
                <td>
                    <div class="truncate-text" th:text="${planning.commentaire}" th:attr="data-bs-toggle='tooltip', data-bs-placement='top', title=${planning.commentaire}"></div>
                </td>
                <td>
                    <a th:href="@{'/planning-de-test/' + ${planning.id} + '/modifier'}" class="btn btn-sm btn-warning">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <a th:href="@{'/planning-de-test/' + ${planning.id} + '/supprimer'}" class="btn btn-sm btn-danger"
                       onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce planning ?');">
                        <i class="bi bi-trash"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Message quand aucun résultat de recherche -->
        <div id="noResultsMessage" class="alert alert-info mt-3 d-none">
            Aucun planning de test ne correspond à votre recherche.
        </div>
    </div>

    <!-- Modal pour ajouter un planning -->
    <div class="modal fade" id="ajouterPlanningModal" tabindex="-1" aria-labelledby="ajouterPlanningModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="ajouterPlanningModalLabel">Nouveau Planning de Test</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/planning-de-test/creer}" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="tache" class="form-label">Tâche</label>
                            <input type="text" class="form-control" id="tache" name="tache" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="dateDebut" class="form-label">Date Début</label>
                                <input type="date" class="form-control" id="dateDebut" name="dateDebut" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="dateFin" class="form-label">Date Fin</label>
                                <input type="date" class="form-control" id="dateFin" name="dateFin" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="commentaire" class="form-label">Commentaire</label>
                            <textarea class="form-control" id="commentaire" name="commentaire" rows="3" required></textarea>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script pour la recherche et le tri -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Référence au tableau et aux éléments de recherche
        const table = document.getElementById('planningsTable');
        const searchInput = document.getElementById('searchInput');
        const startDateInput = document.getElementById('startDate');
        const endDateInput = document.getElementById('endDate');
        const filterDatesBtn = document.getElementById('filterDates');
        const resetDatesBtn = document.getElementById('resetDates');
        const noResultsMessage = document.getElementById('noResultsMessage');

        if (!table) return; // Protection contre les erreurs si le tableau n'existe pas

        const tbody = table.querySelector('tbody');
        const rows = Array.from(tbody.querySelectorAll('tr'));

        // Initialiser les tooltips pour les commentaires
        const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl, {
                html: true
            });
        });

        // Variables pour le tri
        let sortDirection = {};
        let currentSortColumn = null;

        // Fonction de recherche dynamique
        if (searchInput) {
            searchInput.addEventListener('input', function() {
                filterTableRows();
            });
        }

        // Événement pour le filtre par date
        if (filterDatesBtn) {
            filterDatesBtn.addEventListener('click', function() {
                filterTableRows();
            });
        }

        // Événement pour réinitialiser les dates
        if (resetDatesBtn) {
            resetDatesBtn.addEventListener('click', function() {
                startDateInput.value = '';
                endDateInput.value = '';
                filterTableRows();
            });
        }

        // Fonction principale pour filtrer les lignes du tableau
        function filterTableRows() {
            const searchTerm = searchInput ? searchInput.value.toLowerCase().trim() : '';
            const startDate = startDateInput && startDateInput.value ? new Date(startDateInput.value) : null;
            const endDate = endDateInput && endDateInput.value ? new Date(endDateInput.value) : null;

            // Ajuster la fin de journée pour endDate
            if (endDate) {
                endDate.setHours(23, 59, 59, 999);
            }

            let visibleCount = 0;

            rows.forEach(row => {
                // Filtrage par texte
                const text = row.textContent.toLowerCase();
                let isVisible = text.includes(searchTerm);

                // Filtrage supplémentaire par date si nécessaire
                if (isVisible && (startDate || endDate)) {
                    const dateColumns = row.querySelectorAll('.date-value');
                    if (dateColumns.length >= 2) {
                        const rowStartDateStr = dateColumns[0].textContent.trim();
                        const rowEndDateStr = dateColumns[1].textContent.trim();

                        // Conversion des chaînes de date au format Date
                        const rowStartDate = parseDate(rowStartDateStr);
                        const rowEndDate = parseDate(rowEndDateStr);

                        if (rowStartDate && rowEndDate) {
                            // Vérification si les dates du planning chevauchent la plage sélectionnée
                            if (startDate && endDate) {
                                // Cas où les deux dates sont spécifiées
                                isVisible = (rowStartDate <= endDate && rowEndDate >= startDate);
                            } else if (startDate) {
                                // Cas où seule la date de début est spécifiée
                                isVisible = (rowEndDate >= startDate);
                            } else if (endDate) {
                                // Cas où seule la date de fin est spécifiée
                                isVisible = (rowStartDate <= endDate);
                            }
                        }
                    }
                }

                row.style.display = isVisible ? '' : 'none';

                if (isVisible) {
                    visibleCount++;
                    // Ajoute une animation de surbrillance pour les lignes qui correspondent
                    if (searchTerm !== '' || startDate || endDate) {
                        row.classList.add('highlight-row');
                        setTimeout(() => {
                            row.classList.remove('highlight-row');
                        }, 1500);
                    }
                }
            });

            // Afficher un message si aucun résultat n'est trouvé
            if (noResultsMessage) {
                if (visibleCount === 0 && rows.length > 0) {
                    noResultsMessage.classList.remove('d-none');
                } else {
                    noResultsMessage.classList.add('d-none');
                }
            }
        }

        // Fonction pour parser les dates
        function parseDate(dateStr) {
            // Détection du format de la date
            let date;

            // Format FR: DD/MM/YYYY
            if (dateStr.includes('/')) {
                const parts = dateStr.split('/');
                if (parts.length === 3) {
                    date = new Date(parts[2], parts[1] - 1, parts[0]);
                }
            }
            // Format ISO: YYYY-MM-DD
            else if (dateStr.includes('-')) {
                date = new Date(dateStr);
            }

            return date;
        }

        // Configuration du tri
        const headers = table.querySelectorAll('th');

        headers.forEach(header => {
            if (!header.dataset.sort) return; // Ignorer les colonnes sans attribut de tri

            const sortIcon = header.querySelector('.sort-icon');
            if (!sortIcon) return;

            // Initialiser la direction de tri pour cette colonne
            sortDirection[header.textContent.trim()] = 'none';

            header.addEventListener('click', function() {
                const columnName = this.textContent.trim();
                const sortType = this.dataset.sort;

                // Cycle de tri: none -> asc -> desc -> none
                if (sortDirection[columnName] === 'none') {
                    sortDirection[columnName] = 'asc';
                    sortIcon.innerHTML = '<i class="bi bi-arrow-up"></i>';
                } else if (sortDirection[columnName] === 'asc') {
                    sortDirection[columnName] = 'desc';
                    sortIcon.innerHTML = '<i class="bi bi-arrow-down"></i>';
                } else {
                    sortDirection[columnName] = 'none';
                    sortIcon.innerHTML = '<i class="bi bi-arrow-down-up"></i>';

                    // Réinitialiser l'ordre d'origine
                    resetTableOrder();
                    return;
                }

                // Réinitialiser les autres icônes de tri
                headers.forEach(h => {
                    if (h !== header && h.querySelector('.sort-icon')) {
                        h.querySelector('.sort-icon').innerHTML = '<i class="bi bi-arrow-down-up"></i>';
                        sortDirection[h.textContent.trim()] = 'none';
                    }
                });

                // Déterminer l'index de la colonne
                const columnIndex = Array.from(header.parentNode.children).indexOf(header);

                // Trier les lignes
                sortTable(columnIndex, sortDirection[columnName], sortType);
            });
        });

        // Fonction pour trier le tableau
        function sortTable(columnIndex, direction, sortType) {
            const sortedRows = rows.slice().sort((a, b) => {
                const aValue = a.children[columnIndex].textContent.trim();
                const bValue = b.children[columnIndex].textContent.trim();

                // Tri spécial pour les dates
                if (columnIndex === 2 || columnIndex === 3) { // Indices des colonnes de dates
                    const aDate = parseDate(aValue);
                    const bDate = parseDate(bValue);

                    if (aDate && bDate) {
                        return direction === 'asc' ? aDate - bDate : bDate - aDate;
                    }
                }

                if (direction === 'asc') {
                    if (sortType === 'numeric') {
                        return parseFloat(aValue) - parseFloat(bValue);
                    } else {
                        return aValue.localeCompare(bValue, 'fr', { sensitivity: 'base' });
                    }
                } else {
                    if (sortType === 'numeric') {
                        return parseFloat(bValue) - parseFloat(aValue);
                    } else {
                        return bValue.localeCompare(aValue, 'fr', { sensitivity: 'base' });
                    }
                }
            });

            // Vider et remplir le tableau avec les lignes triées
            while (tbody.firstChild) {
                tbody.removeChild(tbody.firstChild);
            }

            sortedRows.forEach(row => tbody.appendChild(row));
        }

        // Fonction pour réinitialiser l'ordre du tableau
        function resetTableOrder() {
            while (tbody.firstChild) {
                tbody.removeChild(tbody.firstChild);
            }

            rows.forEach(row => tbody.appendChild(row));
        }
    });
</script>
</body>
</html>
